sentence=Multi-server NTP client for ESP32 with automatic best-server selection, for WiFi and Ethernet.
paragraph=Runs in its own FreeRTOS task, queries up to three servers with AsyncUDP, ranks them by delay, jitter and dispersion, and sets the system clock from the best one. Includes callbacks, per-server metrics, retry with backoff and a timezone offset.
